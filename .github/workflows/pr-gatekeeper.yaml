name: PR Gatekeeper

on:
    pull_request:
        types: [opened, synchronize, reopened] 
        #by default, the workflow will run on all pull request 
        #events, but we can specify the types of events that we want to trigger the workflow. 
        #In this case, we want to trigger the workflow when a pull request is opened, synchronized (updated), or reopened.
    workflow_dispatch:
        inputs:
            environment:
                description: 'Environment to deploy to'
                required: true
                default: 'dev'
            version:
                description: 'Version of the application to deploy'
                required: true
                default: '1.0.0'


jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - name: Print target branch
              run: |
                echo "Target branch: ${{ github.event.pull_request.base.ref }}"
            - name: Print source branch
              run: |
                echo "Source branch: ${{ github.event.pull_request.head.ref }}"
            - name: Print PR title
              run: |
                echo "PR title: ${{ github.event.pull_request.title }}"
            - name: Print PR body
              run: |
                echo "PR body: ${{ github.event.pull_request.body }}"
            - name: Print PR author
              run: |
                echo "PR author: ${{ github.event.pull_request.user.login }}"
            - name: Print PR labels
              run: |
                echo "PR labels: ${{ github.event.pull_request.labels }}"
            - name: Print PR reviewers
              run: |
                echo "PR reviewers: ${{ github.event.pull_request.requested_reviewers }}"
            - name: PR number
              run: |
                echo "PR number: ${{ github.event.pull_request.number }}"
            - name: Print PR URL
              run: |
                echo "PR URL: ${{ github.event.pull_request.html_url }}"
              
